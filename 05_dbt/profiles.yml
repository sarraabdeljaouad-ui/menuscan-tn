# Connexion de dbt à l'entrepôt. Les valeurs viennent du fichier .env à la racine du dépôt,
# chargé par lancer_dbt.py : aucun mot de passe n'est écrit ici.
menuscan:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5440') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'menuscan') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: menuscan_dwh
      schema: staging
      threads: 4
      connect_timeout: 10
